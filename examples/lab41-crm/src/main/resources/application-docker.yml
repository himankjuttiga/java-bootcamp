# Lab 41 — docker profile. Datasource is built from CRM_DB_* env at runtime (see .env.example),
# so the same image runs anywhere without a URL baked into a layer.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${CRM_DB_HOST}:${CRM_DB_PORT}/${CRM_DB_NAME}
    username: ${CRM_DB_USER}
    password: ${CRM_DB_PASSWORD}
