spring:
  application:
    name: lab39-crm
  datasource:
    # Credentials come from the environment, never from this file. .env is gitignored;
    # .env.example carries placeholders only. A password committed here would live in the
    # repository history permanently, so the fix would be rotation, not a later delete.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crm_lab40}
    username: ${SPRING_DATASOURCE_USERNAME:crm}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities agree with it and
      # refuses to start when they do not: mapping drift becomes a boot failure, not a 3am
      # surprise. Never create, create-drop or update in a shared environment.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  lifecycle:
    timeout-per-shutdown-phase: 20s

# Lab 41: graceful shutdown so SIGTERM drains in-flight requests before exit.
server:
  shutdown: graceful

# Lab 41: readiness for the container HEALTHCHECK; readiness fails closed when the DB is down.
# Only health and info are exposed — never env or beans.
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info

# Agent logins for the lab. Values come from the environment, exactly like the datasource
# password: no defaults here, so a missing variable stops the boot instead of shipping a
# guessable credential.
crm:
  agents:
    agent-a: ${CRM_AGENT_A_PASSWORD}
    agent-b: ${CRM_AGENT_B_PASSWORD}

logging:
  level:
    org.flywaydb: INFO
