apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-api-config
  labels:
    app: crm-api
    lab: "42"
data:
  # Non-secret config only. Passwords live in the Secret (crm-api-secrets).
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_PORT: "8080"
  # From a k3d pod the host-published Postgres is host.k3d.internal (not crm-postgres,
  # which only resolves on the docker compose network). Isolated db for this lab.
  CRM_DB_HOST: "host.k3d.internal"
  CRM_DB_PORT: "5432"
  CRM_DB_NAME: "crm_lab42"
  CRM_DB_USER: "crm"
