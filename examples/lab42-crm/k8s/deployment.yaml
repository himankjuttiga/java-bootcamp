apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-api
  labels:
    app: crm-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-api
  template:
    metadata:
      labels:
        app: crm-api
    spec:
      # k3s PodSecurity often needs an explicit non-root UID at pod level too.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: crm-api
          # Lab 41 image imported into k3d by tag. RepoDigests is empty until the image is
          # pushed to a registry, so there is no @sha256 to pin for a local-only image.
          image: crm-api:lab41
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: crm-api-config
            # DB + agent passwords: Secret created out-of-band, never from Git
            - secretRef:
                name: crm-api-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Three distinct probes: startup gates slow boot, readiness gates traffic, liveness restarts.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
