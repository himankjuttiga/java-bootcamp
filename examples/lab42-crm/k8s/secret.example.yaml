# Example only. Never apply this file, and never put a real password here.
# Create the real Secret out-of-band (see docs/deployment-runbook.md):
#   kubectl -n crm-training create secret generic crm-api-secrets \
#     --from-literal=CRM_DB_PASSWORD=... \
#     --from-literal=CRM_AGENT_A_PASSWORD=... \
#     --from-literal=CRM_AGENT_B_PASSWORD=... \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: crm-api-secrets
  labels:
    app: crm-api
type: Opaque
stringData:
  CRM_DB_PASSWORD: "REPLACE-OUT-OF-BAND"
  CRM_AGENT_A_PASSWORD: "REPLACE-OUT-OF-BAND"
  CRM_AGENT_B_PASSWORD: "REPLACE-OUT-OF-BAND"
